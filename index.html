<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRESTASIPLUS</title>
    <style id="pp-splash-css">
      #pp-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fff;
        color: #1e293b;
        font:
          600 14px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #pp-splash b {
        font-size: 22px;
        letter-spacing: 0.14em;
        font-weight: 800;
      }
      #pp-splash i {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(100, 116, 139, 0.3);
        border-top-color: #2563eb;
        animation: pp-spin 0.8s linear infinite;
      }
      @keyframes pp-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        #pp-splash {
          background: #0f172a;
          color: #e2e8f0;
        }
        #pp-splash i {
          border-color: rgba(148, 163, 184, 0.3);
          border-top-color: #60a5fa;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #pp-splash i {
          animation: none;
          border-top-color: rgba(100, 116, 139, 0.3);
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="pp-splash" role="status" aria-live="polite">
        <b>PRESTASIPLUS</b><i aria-hidden="true"></i><span>Memuatkan…</span>
      </div>
      <!--pp-splash-end-->
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
