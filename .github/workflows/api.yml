# Backend CI (BE-01). Mirrors `npm run be:verify` plus the docker build and a secret scan.
name: api

on:
  push:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'docker/api/**'
      - 'compose.yaml'
      - '.env.db.example'
      - 'compose.override.example.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api.yml'
      - 'scripts/**'
      - '.github/security/**'
      - '.trivyignore'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'docker/api/**'
      - 'compose.yaml'
      - '.env.db.example'
      - 'compose.override.example.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api.yml'
      - 'scripts/**'
      - '.github/security/**'
      - '.trivyignore'
  # BE-33 (G4 minor 4): new advisories are caught weekly even when no PR touches the API (Monday 02:17 UTC).
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Throw-away Postgres for the integration tests (BE-02). Throw-away credentials, CI-only.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prestasiplus_test
          POSTGRES_USER: pp
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pp -d prestasiplus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pp:ci-throwaway-not-a-secret@localhost:5432/prestasiplus_test
      DATABASE_URL: postgresql://pp:ci-throwaway-not-a-secret@localhost:5432/prestasiplus_test
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Guard - no dumps, no .migration-out, no large migration fixtures (BE-NFR-13)
        run: |
          bad="$(git ls-files -- '*.dump' '*.sql.gz' '.migration-out/*' '*/.migration-out/*')"
          big="$(git ls-files -z -- apps/api/test/migration | xargs -0 -r stat -c '%s %n' | awk '$1 > 1048576')"
          if [ -n "$bad" ] || [ -n "$big" ]; then
            echo "Forbidden files are tracked (dumps, .migration-out/, or a file over 1 MB under apps/api/test/migration/):"
            echo "$bad"
            echo "$big"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run contract:check
      - run: npm test -w @pp/contract-tests
      - run: npm run be:lint
      - run: npm run be:lint:migration
      - run: npm run be:typecheck
      - run: npm run be:test
      - run: npm run be:build

  # BE-31: breaking-change gate for packages/contract/openapi.json (oasdiff, pinned image).
  # Expected on a backend sync PR into be/integration-frontend: the PR brings the newer backend contract, so the
  # diff against the older frontend base can report "breaking" changes that are already merged on feature/v2-backend.
  # That is not suppressed here. The LEAD checks the report and waives it with the label `contract-breaking`.
  openapi-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: openapi-diff (fails on breaking changes unless the PR has the label contract-breaking)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -u
          work="$RUNNER_TEMP/openapi-diff"; mkdir -p "$work"
          # The checkout is the PR merge commit; its merge-base with the base branch is the base tip.
          base_sha="$(git merge-base HEAD "origin/$BASE")"
          if ! git show "$base_sha:packages/contract/openapi.json" > "$work/base.json" 2>/dev/null; then
            echo "No openapi.json on $BASE yet; nothing to compare."; exit 0
          fi
          cp packages/contract/openapi.json "$work/head.json"
          waived=false
          if gh pr view "$PR" --json labels -q '.labels[].name' | grep -qx 'contract-breaking'; then waived=true; fi
          set +e
          docker run --rm -v "$work:/work:ro" tufin/oasdiff:v1.34.0 \
            breaking /work/base.json /work/head.json --fail-on ERR | tee "$work/result.txt"
          code=${PIPESTATUS[0]}
          set -e
          { echo '### openapi-diff'; echo '```'; cat "$work/result.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ] && [ "$waived" = true ]; then
            echo "Breaking changes found, waived by the label contract-breaking."; exit 0
          fi
          exit "$code"

  # BE-33 (AC6): production dependencies. Fails on any high or critical advisory that is not in the allow-list
  # (.github/security/npm-audit-allowlist.json: id, package, reason, expires; an expired entry fails too).
  deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: npm audit gate (production dependencies, high and critical)
        run: |
          # npm audit exits 1 when it finds anything; the gate decides, so ignore that status here.
          npm audit --omit=dev --json > audit.json || true
          node scripts/npm-audit-gate.mjs --file audit.json

  # BE-33 (AC6): new or changed dependencies in a pull request (license-neutral; vulnerabilities only).
  # Dependency review needs the repository's dependency graph (a repository setting). A probe step asks the
  # dependency-graph compare API first, with the same read-only token the review action uses. If that API refuses
  # (HTTP 403/404, or "not supported"), the dependency graph is off for this repository, so the review step is skipped
  # with a warning (the npm audit gate above still runs). Any other probe error fails the job, and a high-severity
  # finding fails the review step as before. No continue-on-error (ci-workflow.spec.ts).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Is dependency review supported here
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          if out="$(gh api "repos/$REPO/dependency-graph/compare/$BASE_SHA...$HEAD_SHA" 2>&1)"; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -qiE 'not supported|HTTP 403|HTTP 404'; then
            echo "::warning::Dependency review is not available on this repository ($(printf '%s' "$out" | grep -oE 'HTTP [0-9]+' | head -n 1)); enable the dependency graph in the repository settings. Skipped."
            echo "supported=false" >> "$GITHUB_OUTPUT"
          else
            echo "The dependency-graph support check gave an unexpected answer:"; printf '%s\n' "$out" | head -n 5; exit 1
          fi
      - if: steps.probe.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4.7.3
        with:
          fail-on-severity: high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Throw-away Postgres for the boot smoke below (CI-only credentials).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prestasiplus_smoke
          POSTGRES_USER: pp
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pp -d prestasiplus_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Validate compose file
        run: docker compose config -q
      - name: Build API image
        run: docker build -f docker/api/Dockerfile -t pretasiplus-api:ci .
      - name: Non-root check
        run: |
          uid="$(docker run --rm --entrypoint id pretasiplus-api:ci -u)"
          echo "uid=$uid"
          test "$uid" != "0"
      # BE-33 (AC5): read-only root filesystem, /tmp as tmpfs, non-root user.
      - name: Read-only run (node -v)
        run: docker run --rm --read-only --tmpfs /tmp --user node pretasiplus-api:ci node -v
      # BE-33 (AC5): migrate (build stage, as the compose migrate job does), then boot the runtime image read-only
      # against the service Postgres. Proves: the process starts as node with a read-only rootfs and only /tmp and
      # FILE_STORAGE_DIR writable, /api/health answers (liveness), /api/ready answers 200 (database up, migrations
      # applied), and SIGTERM ends the process with exit code 0. It does not prove a slow in-flight request finishes
      # (that is apps/api/test/security/shutdown.spec.ts).
      - name: Migrate (build stage image, read-only)
        run: |
          docker build -f docker/api/Dockerfile --target build -t pretasiplus-api-migrate:ci .
          docker run --rm --read-only --tmpfs /tmp --user node --network host \
            -e NODE_ENV=production -e HOME=/tmp -e npm_config_cache=/tmp/.npm -e npm_config_update_notifier=false \
            -e DATABASE_URL=postgresql://pp:ci-throwaway-not-a-secret@127.0.0.1:5432/prestasiplus_smoke \
            -w /app pretasiplus-api-migrate:ci npm run be:db:migrate
      - name: Boot smoke (read-only, tmpfs, SIGTERM)
        run: |
          set -u
          docker run -d --name api-smoke --read-only --tmpfs /tmp --tmpfs /var/lib/pretasiplus/files:uid=1000,gid=1000,mode=0700 \
            --user node --cap-drop ALL --security-opt no-new-privileges:true --network host \
            -e NODE_ENV=production -e PORT=3000 \
            -e DATABASE_URL=postgresql://pp:ci-throwaway-not-a-secret@127.0.0.1:5432/prestasiplus_smoke \
            -e "SESSION_SECRET=$(head -c 24 /dev/urandom | base64)" \
            -e "IC_HASH_KEY=$(head -c 36 /dev/urandom | base64)" \
            pretasiplus-api:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then echo "health never answered"; docker logs api-smoke; exit 1; fi
          curl -fsS http://127.0.0.1:3000/api/ready
          echo
          docker stop --time 30 api-smoke
          code="$(docker inspect -f '{{.State.ExitCode}}' api-smoke)"
          echo "exit code after SIGTERM: $code"
          docker logs api-smoke | tail -n 20
          docker rm -f api-smoke > /dev/null
          test "$code" = "0"
      # BE-33 (AC6): image scan. HIGH and CRITICAL with a fix available fail the job. Exceptions: .trivyignore
      # (one id per line with a reason comment and `exp:YYYY-MM-DD`; Trivy ignores an expired line, so it fails again).
      # Pinned by the full commit SHA of the release tag `v0.33.1`. The upstream tags carry a `v` prefix, so the
      # earlier `@0.33.1` could not be resolved and the job failed before the scan.
      # `version` pins the Trivy binary: the action's default (v0.65.0) has no release asset any more (download 404),
      # so the install step failed. v0.76.1's Linux-64bit asset is checked present (HTTP 200).
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.76.1
          image-ref: pretasiplus-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose
