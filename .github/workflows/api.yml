# Backend CI (BE-01). Mirrors `npm run be:verify` plus the docker build and a secret scan.
name: api

on:
  push:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'docker/api/**'
      - 'compose.yaml'
      - '.env.db.example'
      - 'compose.override.example.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'docker/api/**'
      - 'compose.yaml'
      - '.env.db.example'
      - 'compose.override.example.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api.yml'

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Throw-away Postgres for the integration tests (BE-02). Throw-away credentials, CI-only.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prestasiplus_test
          POSTGRES_USER: pp
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pp -d prestasiplus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pp:ci-throwaway-not-a-secret@localhost:5432/prestasiplus_test
      DATABASE_URL: postgresql://pp:ci-throwaway-not-a-secret@localhost:5432/prestasiplus_test
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run contract:check
      - run: npm run be:lint
      - run: npm run be:typecheck
      - run: npm run be:test
      - run: npm run be:build

  # BE-31: breaking-change gate for packages/contract/openapi.json (oasdiff, pinned image).
  openapi-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: openapi-diff (fails on breaking changes unless the PR has the label contract-breaking)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -u
          work="$RUNNER_TEMP/openapi-diff"; mkdir -p "$work"
          # The checkout is the PR merge commit; its merge-base with the base branch is the base tip.
          base_sha="$(git merge-base HEAD "origin/$BASE")"
          if ! git show "$base_sha:packages/contract/openapi.json" > "$work/base.json" 2>/dev/null; then
            echo "No openapi.json on $BASE yet; nothing to compare."; exit 0
          fi
          cp packages/contract/openapi.json "$work/head.json"
          waived=false
          if gh pr view "$PR" --json labels -q '.labels[].name' | grep -qx 'contract-breaking'; then waived=true; fi
          set +e
          docker run --rm -v "$work:/work:ro" tufin/oasdiff:v1.34.0 \
            breaking /work/base.json /work/head.json --fail-on ERR | tee "$work/result.txt"
          code=${PIPESTATUS[0]}
          set -e
          { echo '### openapi-diff'; echo '```'; cat "$work/result.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ] && [ "$waived" = true ]; then
            echo "Breaking changes found, waived by the label contract-breaking."; exit 0
          fi
          exit "$code"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Validate compose file
        run: docker compose config -q
      - name: Build API image
        run: docker build -f docker/api/Dockerfile -t pretasiplus-api:ci .
      - name: Non-root check
        run: |
          uid="$(docker run --rm --entrypoint id pretasiplus-api:ci -u)"
          echo "uid=$uid"
          test "$uid" != "0"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose
