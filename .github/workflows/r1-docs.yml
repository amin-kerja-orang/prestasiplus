# R1 docs gate: PRD <-> plan traceability (scripts/r1-trace-check.mjs). No install needed (Node built-ins only).
# Runs on EVERY pull request (no path filter) and on pushes to feature/v3-bijak-r1 so that the required check `r1-docs` always reports; this is why
# frontend.yml has no trace step (one run per PR).
name: r1-docs

on:
  pull_request:
  push:
    branches: [feature/v3-bijak-r1]

permissions:
  contents: read

concurrency:
  group: r1-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  r1-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: PRD to plan traceability
        run: node scripts/r1-trace-check.mjs
