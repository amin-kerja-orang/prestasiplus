# Local preview of the v2 prototype in Docker, so it is visible and can be stopped from Docker Desktop.
#
#   Build:  npx vite build --mode demo --outDir dist-preview
#           (with VITE_PROTOTYPE_SCOPE=on VITE_API_MODE=mock VITE_TEST_HOOKS=false)
#   Start:  docker compose -f docker-compose.preview.yml up -d
#   Stop:   docker compose -f docker-compose.preview.yml down   (or Stop in Docker Desktop)
# No fixed container_name: the container is `<project>-preview-1` (default project `pretasiplus-preview`), so
# `docker compose -p <name> -f docker-compose.preview.yml up -d` can run a second copy (change the host port too).
#
# dist-preview is mounted read-only: after a rebuild, just refresh the browser.
name: pretasiplus-preview

services:
  preview:
    image: nginx:1.27-alpine
    ports:
      - '5191:80'
    volumes:
      - ./dist-preview:/usr/share/nginx/html:ro
      - ./docker/preview/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: 'no'
