# PrestaPlus v2 containers. Guide: docs/ops/containers.md
#   cp .env.example .env     (optional; defaults work for the prototype)
#   docker compose build
#   docker compose up -d     -> http://localhost:5192
#   docker compose down
# The older docker-compose.preview.yml (host-built dist-preview, port 5191) still works unchanged.
name: pretasiplus

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-demo}
        VITE_API_MODE: ${VITE_API_MODE:-mock}
        VITE_TEST_HOOKS: ${VITE_TEST_HOOKS:-false}
        VITE_PROTOTYPE_SCOPE: ${VITE_PROTOTYPE_SCOPE:-on}
        VITE_MOCK_LATENCY_MS: ${VITE_MOCK_LATENCY_MS:-400}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: pretasiplus-frontend:local
    container_name: pretasiplus-frontend
    ports:
      - '${FRONTEND_PORT:-5192}:8080'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: 'no'

  # ---- NestJS API (BE-01). Guide: docs/ops/containers.md ----
  # No host port by default (the frontend nginx proxies /api to api:3000 from BE-32).
  # For local tooling add an uncommitted compose.override.yaml with ports: ['127.0.0.1:3000:3000'].
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: pretasiplus-api:local
    container_name: pretasiplus-api
    env_file:
      - path: .env.api              # secrets: DATABASE_URL, session secret; never committed
        required: false             # optional until BE-02 adds required secrets
    environment:
      NODE_ENV: production
      PORT: 3000
    # depends_on is activated in BE-02 (when the db service exists):
    # depends_on:
    #   db:
    #     condition: service_healthy
    expose:
      - '3000'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: 'no'

