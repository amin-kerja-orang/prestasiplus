# PrestaPlus v2 containers. Guide: docs/ops/containers.md
#   cp .env.example .env     (optional; defaults work for the prototype)
#   docker compose build
#   docker compose up -d     -> http://localhost:5192
#   docker compose down
# The older docker-compose.preview.yml (host-built dist-preview, port 5191) still works unchanged.
name: pretasiplus

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-demo}
        VITE_API_MODE: ${VITE_API_MODE:-mock}
        VITE_TEST_HOOKS: ${VITE_TEST_HOOKS:-false}
        VITE_PROTOTYPE_SCOPE: ${VITE_PROTOTYPE_SCOPE:-on}
        VITE_MOCK_LATENCY_MS: ${VITE_MOCK_LATENCY_MS:-400}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_BUILD_SHA: ${VITE_BUILD_SHA:-}
    image: pretasiplus-frontend:local
    container_name: pretasiplus-frontend
    ports:
      - '${FRONTEND_PORT:-5192}:8080'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: 'no'

