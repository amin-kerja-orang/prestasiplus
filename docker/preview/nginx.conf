# Local preview of the v2 prototype build (dist-preview). SPA: unknown paths fall back to index.html.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Always fetch a fresh index.html so a rebuild shows without a hard refresh.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
