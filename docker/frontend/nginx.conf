# Production nginx for the v2 SPA. Runs as the unprivileged `nginx` user, so it listens on 8080
# and keeps its pid and temp files in /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Access log without secrets in the URL (BE-25 follow-up): a 64-hex path segment (a parent invite
  # token, 256 bit) is logged as [redacted], and the Referer is not logged at all because an SPA page
  # URL may carry the same token. The API redacts the same pattern in its own logs.
  map $request $log_request {
    "~^(?<pre>.*?)[0-9a-fA-F]{64}(?<post>.*)$" "${pre}[redacted]${post}";
    default $request;
  }
  # 413 message for nginx's own body-limit answer under /api/ (see @api_too_large). A route whose contract
  # fixes its own 413 copy gets that copy; every other route gets the generic one.
  # /api/admin/students/import: StudentImportTooLargeSchema (STUDENT_IMPORT_MESSAGES.tooLarge).
  map $uri $api_413_message {
    default                      "Data terlalu besar.";
    /api/admin/students/import   "Fail import melebihi had yang dibenarkan.";
  }
  log_format main '$remote_addr [$time_local] "$log_request" $status $body_bytes_sent rt=$request_time rid=$request_id "$http_user_agent"';
  access_log /dev/stdout main;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/manifest+json image/svg+xml font/ttf application/wasm;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers (repeated in each location that sets its own add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- API (BE-32): one origin, so the session cookie is same-site and no CORS is configured. ----
    # `set $api` + `resolver` resolve the name at request time (Docker DNS), so this image still starts
    # when no api container exists (mock-mode compose). With a variable and no URI part, the request
    # URI is passed on unchanged. Outside Docker, change the resolver or use a fixed upstream.
    # Body limits: the API enforces each purpose itself (MAX_UPLOAD_MB=10 global ceiling,
    # INTAKE_MAX_FILE_MB=20 for derived intake files, JSON 100kb, imports 2200kb); nginx is the outer
    # fence. If either env value is raised, raise the file-upload size below (value plus ~2m of
    # multipart overhead). A new multipart route (BE-37 intake) needs its own location like /api/files.
    # Not cached: no proxy_cache is configured and the API sends no-store on session/CSRF responses.
    # TRUST_PROXY_HOPS=1 on the api matches this single hop: the API reads the LAST X-Forwarded-For
    # entry (the address nginx saw), which a client cannot choose. Behind a further load balancer,
    # raise it to 2 and add real_ip handling here.
    location /api/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $api_upstream http://api:3000;
      client_max_body_size 3m;               # JSON bodies and the 2200kb import bodies
      error_page 413 = @api_too_large;       # JSON envelope instead of nginx's HTML page
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
      proxy_cache off;
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 120s;               # polling endpoints and slow reports
    }

    location = /api/files {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $api_upstream http://api:3000;
      client_max_body_size 22m;              # max(MAX_UPLOAD_MB, INTAKE_MAX_FILE_MB) + overhead
      error_page 413 = @files_too_large;     # JSON envelope instead of nginx's HTML page
      client_body_timeout 120s;              # slow mobile uploads
      proxy_request_buffering on;            # the API only sees a complete body
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
      proxy_cache off;
      proxy_connect_timeout 5s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;               # large uploads and downloads
    }

    # 413 from nginx's own body limits, in the API error envelope (ErrorBodySchema: {"error":{"code","message","requestId"}})
    # so the SPA transport can parse it. Code and BM copy follow the API/contract: code PAYLOAD_TOO_LARGE
    # (AllExceptionsFilter, contract 413 responses), message INTAKE_MESSAGES.payloadTooLarge for JSON bodies and
    # the Pages worker's "Fail terlalu besar." for uploads. These locations add Cache-Control, and one add_header in
    # a location drops every inherited server-level add_header, so the security headers are repeated here.
    # Keep the JSON on one line and free of characters that need escaping:
    # nginx expands $request_id (hex) into it.
    location @api_too_large {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"$api_413_message","requestId":"$request_id"}}';
    }

    location @files_too_large {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Fail terlalu besar.","requestId":"$request_id"}}';
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Hashed build output: cache for a year.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      try_files $uri =404;
    }

    # Entry document: always revalidate so a new release shows at once.
    location = /index.html {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA fallback: unknown paths (deep links) serve index.html.
    location / {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
