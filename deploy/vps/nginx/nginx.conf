# Edge nginx for the production VPS (AZ-09). Mounted over /etc/nginx/nginx.conf of the official nginx image.
# The server blocks come from templates/pp.conf.template, rendered at container start into conf.d (tmpfs).
# Master runs as root (to bind 80/443 and read the certbot key files); workers run as `nginx`.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;

  # Access log without secrets in the URL: same redaction as docker/frontend/nginx.conf (a 64-hex path segment,
  # a parent invite token, is logged as [redacted]) and no Referer. The API redacts the same pattern.
  map $request $log_request {
    "~^(?<pre>.*?)[0-9a-fA-F]{64}(?<post>.*)$" "${pre}[redacted]${post}";
    default $request;
  }
  log_format edge '$remote_addr [$time_local] "$log_request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time rid=$request_id "$http_user_agent"';
  access_log /dev/stdout edge;

  # Other temp files on tmpfs (read-only rootfs).
  # Disk-backed volume (compose: edgetmp), NOT tmpfs: big bodies must not count against the memory limit.
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path /var/cache/nginx/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Compression for the SPA (index.html, JS, CSS, SVG). Responses that the frontend nginx already gzipped are
  # passed through untouched. It is NOT applied to /api: the API's JSON carries the CSRF token (BREACH risk) and
  # the API does not compress either.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/manifest+json
             image/svg+xml font/ttf application/wasm;

  # Per-address connection cap for the many-file upload routes only (the API has its own request throttles).
  limit_conn_zone $binary_remote_addr zone=pp_big_uploads:10m;
  limit_conn_zone $server_name zone=pp_big_global:1m;

  include /etc/nginx/conf.d/*.conf;
}
