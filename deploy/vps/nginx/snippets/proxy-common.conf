# Headers for every proxied location. The edge is the ONLY proxy in front of the API, so the client address is
# OVERWRITTEN with the peer address nginx saw (a client-supplied X-Forwarded-For can never reach the API).
# This matches TRUST_PROXY_HOPS=1 in compose.prod.yaml. If a CDN or load balancer is ever put in front of the
# edge, set the real client address with ngx_http_realip_module first and change TRUST_PROXY_HOPS accordingly
# (runbook section 3, "Proxy chain").
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header Connection "";
proxy_cache off;
