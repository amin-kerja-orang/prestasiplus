# SPA Content-Security-Policy, ENFORCED. Same policy as csp-report-only.conf; keep the two files identical apart from the header name.
# - script-src 'self': the Vite build has no inline script.
# - style-src 'unsafe-inline': Vue sets inline style attributes and index.html carries the splash <style>.
# - img-src https:: article/banner images may come from the origins in PUBLIC_ORIGINS, and video thumbnails from img.youtube.com.
# - frame-src: the video embeds the SPA allows (VideoPlayerFrame: youtube, vimeo, dailymotion).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-src https://www.youtube.com https://player.vimeo.com https://www.dailymotion.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
