# Added to the SPA locations only. The API sets its own security headers (nosniff, DENY, no-referrer, COOP/CORP,
# CSP default-src 'none', and HSTS in production) and the frontend nginx adds the basic ones to the SPA files, so
# nothing is added here for /api and nothing is repeated for the SPA: HSTS and the CSP are the two headers the
# frontend container does not send. The CSP itself is included next to this file by the template, chosen by
# PP_CSP_MODE (report-only | enforce | off).
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
