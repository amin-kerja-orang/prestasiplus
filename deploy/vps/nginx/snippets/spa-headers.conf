# Included in the SPA location. The API sets its own security headers (nosniff, DENY, no-referrer, COOP/CORP,
# CSP default-src 'none') and the frontend nginx adds the basic ones to the SPA files, so nothing is repeated here.
# The two headers the frontend container does not send come from rendered snippets next to it:
#   - HSTS: conf.d/snippets/hsts.conf (PP_HSTS), included in every https location, /api too (one policy per host);
#   - the CSP: conf.d/snippets/csp-<PP_CSP_MODE>.conf (report-only | enforce | off).
# This file adds no header itself; it stays as the hook for any future SPA-only header.
