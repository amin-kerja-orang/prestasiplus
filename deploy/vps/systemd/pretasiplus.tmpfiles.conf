# Install: sudo install -m 644 deploy/vps/systemd/pretasiplus.tmpfiles.conf /etc/tmpfiles.d/pretasiplus.conf
#          sudo systemd-tmpfiles --create /etc/tmpfiles.d/pretasiplus.conf
# The shared lock (PP_LOCK_FILE, default /var/lock/pretasiplus.lock = /run/lock/pretasiplus.lock) is created at every
# boot owned by the deploy user, and `z` repairs owner and mode if a root run left it root:root 0600.
# Edit the path, user and group if PP_LOCK_FILE or the deploy user differ.
f /run/lock/pretasiplus.lock 0660 ppdeploy ppdeploy -
z /run/lock/pretasiplus.lock 0660 ppdeploy ppdeploy -
